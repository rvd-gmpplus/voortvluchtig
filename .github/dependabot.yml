# Houdt de GitHub Actions en @playwright/test bij. Elke update komt als pull request binnen en
# draait eerst de volledige test-job; merge pas als die groen is.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ['*']
